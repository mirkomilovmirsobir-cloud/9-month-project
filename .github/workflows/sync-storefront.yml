name: Sync storefront from published site

on:
  push:
    paths:
      - '.github/workflows/sync-storefront.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download published files
        run: |
          set -euo pipefail
          base="https://smartmarket-qocyls-preview.freebuff.site"
          curl -fsSL "$base/index.html" -o index.html
          curl -fsSL "$base/styles.css" -o styles.css
          curl -fsSL "$base/main.js" -o main.js
          test "$(wc -c < index.html)" -gt 50000
          test "$(wc -c < main.js)" -gt 100000
          grep -q "heroCategories" index.html
          grep -q "ACCOUNT GATE" main.js

      - name: Commit storefront update
        run: |
          set -euo pipefail
          git config user.name "SmartMarket sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html styles.css main.js
          if git diff --cached --quiet; then
            echo "Already up to date"
            exit 0
          fi
          git commit -m "Require an account for checkout and wishlist"
          git push origin HEAD:main
